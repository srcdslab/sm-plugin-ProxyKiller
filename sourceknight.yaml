project:
  sourceknight: 0.3
  name: ProxyKiller

  dependencies:
    - name: sourcemod
      type: tar
      version: 1.12
      location: https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7165-linux.tar.gz
      unpack:
        - source: /addons
          dest: /addons

    - name: ext-steamworks
      type: git
      repo: https://github.com/srcdslab/sm-ext-SteamWorks
      unpack:
        - source: /Pawn/include
          dest: /addons/sourcemod/scripting/include

    - name: json
      type: git
      repo: https://github.com/clugg/sm-json
      unpack:
        - source: /addons/sourcemod/scripting/include
          dest: /addons/sourcemod/scripting/include

  root: /
  output: /addons/sourcemod/plugins

  targets:
    - ProxyKiller
